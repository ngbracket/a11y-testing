name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vitest strips types without checking them, so type-check the tests here.
      - run: npm run typecheck
      - run: npm test
